# TokenPool nginx server block (v3, 2026-08-12 上线加固)
# 部署策略（v3 更新）：优先**原位替换**现网 sharetoken 站点，避免双 server block / 端口冲突
#   - 目标文件：/etc/nginx/sites-available/YOUR-DOMAIN
#   - 现网 symlink：/etc/nginx/sites-enabled/YOUR-DOMAIN → 同上；不需变动
#   - 证书：/etc/nginx/ssl/{fullchain,privkey}.pem；不需变动
#   - 公网入口：https://YOUR-DOMAIN:19876（证书 SNI 匹配 sharetoken 域名）
# 设计原则：
#   1) root 严格指向 /root/project/llm-key-manager/public（不暴露源码目录）
#   2) 仅放行精确白名单路径：/、/index.html、/favicon.svg、/supabase-js.js、/v1/
#      未匹配任何白名单直接 404（取消 SPA fallback 200，避免源码 / SQL 漏出）
#   3) /v1/ 反代到 127.0.0.1:20140（node gateway.mjs）；上游 AbortController 上限 270s
#      proxy_read_timeout 设 300s 兜底，确保 nginx 不会先于上游切断
#   4) API 502/504/503 返回 JSON 错误，绝不映射到 index.html（避免 SPA 把上游错误当 200）
#   5) 静态目录禁用隐藏文件 + 限定 MIME
#   6) 响应头加固：HSTS / X-Frame-Options / Referrer-Policy / X-Content-Type-Options
#   7) CSP 兼容：内联 <script>/<style>、Google OAuth 回跳、Turnstile 脚本与帧
#   8) 解决 nginx 子 location add_header 覆盖父级 add_header 的坑：
#      用 `expires` 指令替代子 location 的 Cache-Control add_header，避免父级安全头丢失
#
# 部署（原位替换，禁止新增 tokenpool 站点）：
#   sudo cp /etc/nginx/sites-available/YOUR-DOMAIN \
#           /etc/nginx/sites-available/YOUR-DOMAIN.bak.$(date +%s)
#   sudo cp /root/project/llm-key-manager/deploy/nginx-tokenpool.conf \
#           /etc/nginx/sites-available/YOUR-DOMAIN
#   sudo /usr/sbin/nginx -t
#   sudo nginx -s reload    # 或 sudo systemctl reload nginx
#
# 风险：
#   - 若 public/ 目录权限不是 755（root:root），nginx worker 读不到 → 403
#   - 若 127.0.0.1:20140 未启动 → /v1/ 全部 502（已配置 JSON 错误）
#   - CSP 兼容基线如下；若前端引入新外链域名，必须同步追加 connect-src / script-src / frame-src
#   - 若回滚：sudo cp sites-available/YOUR-DOMAIN.bak.<ts> \
#                    sites-available/YOUR-DOMAIN && sudo nginx -s reload
#   - 不要再新增 sites-available/tokenpool，避免与现网 sharetoken 站点双 server block 监听 19876

server {
    listen 19876 ssl;
    listen [::]:19876 ssl;

    # 现网证书：实际部署位置 /etc/nginx/ssl/（务必 chown root:root 0600 privkey）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server_name YOUR-DOMAIN;

    # ---- 静态资源根：仅公开 public/ 目录（不允许源码、SQL、脚本随意外漏） ----
    root /root/project/llm-key-manager/public;
    index index.html;

    # 拒绝所有隐藏文件 + 非白名单扩展名（含源码、SQL、cron、env、备份）
    location ~ /\.(?!well-known/) { deny all; return 404; }
    location ~* \.(sql|mjs|js\.map|md|env|sh|json\.bak|sql\.bak|orig|cron|conf|sql\.orig|sql\.gz|tar|gz|bak)$ { deny all; return 404; }

    # ---- 通用响应头（server 级；子 location 不要再加 add_header，否则会被覆盖） ----
    # CSP 兼容现有内联脚本 / 样式、Supabase REST、Google OAuth、Turnstile
    #   default-src 'self'                       — 仅本域
    #   script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com
    #                                            ^ 当前 index.html 含 inline <script> 块 ^ Turnstile 加载器
    #   style-src 'self' 'unsafe-inline'         — <style> 内联
    #   img-src 'self' data: https:              — data: 用于 inline icon
    #   font-src 'self' data:                    — data: 用于 inline icon font
    #   connect-src 'self' https://YOUR-PROJECT.supabase.co https://accounts.google.com https://github.com https://api.day.app
    #                                            ^ Supabase REST/Realtime ^ OAuth code exchange ^ Bark 推送
    #   frame-src https://challenges.cloudflare.com https://accounts.google.com
    #                                            ^ Turnstile iframe ^ Google OAuth popup
    #   frame-ancestors 'none'                   — 防 clickjacking
    #   form-action 'self'                       — 提交只允许同源
    #   base-uri 'self'
    #   object-src 'none'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://YOUR-PROJECT.supabase.co https://accounts.google.com https://github.com https://api.day.app; frame-src https://challenges.cloudflare.com https://accounts.google.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ---- /v1/* 反代到本地网关 ----
    # 上游 gateway.mjs 的 AbortController 上限为 270s；nginx 设 300s 兜底，
    # 这样网关先 cancel 时 nginx 不再二次截断；网关 270s 仍未响应则走 504（JSON）
    location /v1/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:20140;
        # 流式响应支持（/v1/chat/completions 支持 stream=true）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 上游 401 / 429 / 500 自带 JSON body；保留原状态码透传
        proxy_intercept_errors on;
        # 上游宕机 / 网关宕机 / 超时 → JSON 错误，绝不映射到 index.html
        error_page 502 503 504 = @api_error;
    }

    # ---- 精确白名单静态资源 ----
    # / 与 /index.html：HTML 默认入口；用 `expires -1` 等价 no-cache
    # ⚠️ 不在本 location 里 add_header Cache-Control（nginx 子 location 加 add_header 会
    #    覆盖父级 server 的所有 add_header，导致安全头丢失）
    location = / {
        # 命中根路径返回 public/index.html
        try_files /index.html =404;
        expires -1;
    }
    location = /index.html {
        try_files $uri =404;
        expires -1;
    }
    # favicon：用 expires 替代 add_header Cache-Control（避免覆盖父级安全头）
    location = /favicon.svg {
        types { image/svg+xml svg; }
        try_files $uri =404;
        expires 1d;
    }
    # supabase-js：用 expires 替代 add_header Cache-Control（避免覆盖父级安全头）
    location = /supabase-js.js {
        types { application/javascript js; }
        try_files $uri =404;
        expires 1d;
    }

    # ---- 兜底：所有未匹配白名单的路径直接 404（取消 SPA fallback 200） ----
    location / {
        return 404;
    }

    # ---- API JSON 错误（502/503/504）----
    location @api_error {
        default_type application/json;
        return 502 '{"error":{"message":"Gateway unavailable, please retry later"}}';
    }

    # ---- 安全与日志 ----
    client_max_body_size 1m;        # 不上传大文件
    server_tokens off;              # 隐藏 nginx 版本
    access_log /var/log/nginx/tokenpool.access.log;
    error_log /var/log/nginx/tokenpool.error.log warn;
}